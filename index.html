<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>鐘カウンター（高視認性版）</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; background: #f4f4f9; color: #000; padding: 4px; margin: 0; font-size: 16px; }
        .panel { background: #fff; padding: 6px; border-radius: 8px; margin-bottom: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        h2 { margin: 0 0 2px 0; font-size: 1.2em; }
        
        .header-flex { display: flex; justify-content: space-between; align-items: center; }
        .counter-display { font-size: 2.8em; font-weight: bold; color: #d32f2f; margin-left: 8px; }
        
        button { padding: 10px 14px; border: none; border-radius: 6px; cursor: pointer; background: #007bff; color: white; font-size: 14px; font-weight: bold; }
        button.btn-red { background: #dc3545; }
        button.btn-gray { background: #6c757d; }
        
        /* ログエリアを最大限に拡大 */
        textarea { width: 100%; height: 120px; font-family: monospace; font-size: 13px; border: 1px solid #999; border-radius: 4px; padding: 4px; }
        
        .setting-input { width: 60px; text-align: right; font-size: 14px; border: 1px solid #999; padding: 2px; }
        
        /* メーター周り */
        .band-row { display: grid; grid-template-columns: 80px 1fr 60px; gap: 6px; align-items: center; margin-bottom: 8px; }
        .meter-container { width: 100%; height: 28px; background: #eee; border-radius: 6px; position: relative; overflow: hidden; }
        .meter-fill { height: 100%; width: 0%; background: #007bff; }
        .meter-peak-line { position: absolute; top: 0; bottom: 0; width: 3px; background: green; z-index: 10; }
        /* 最高値数値をメーター横に表示 */
        .peak-val { font-size: 12px; color: green; font-weight: bold; position: absolute; right: 2px; top: 4px; background: rgba(255,255,255,0.7); padding: 0 2px; }
    </style>
</head>
<body>

<div class="panel">
    <div class="header-flex">
        <h2>鐘カウンター</h2>
        <div id="current-time" style="font-size: 13px;">--:--:--</div>
    </div>
    <div class="header-flex">
        <div style="display: flex; align-items: center;">
            <span style="font-weight: bold;">回数</span>
            <span class="counter-display" id="count-value">0</span>
        </div>
        <div style="display: flex; gap: 6px;">
            <button class="btn-gray" onclick="changeCount(-1)">−1</button>
            <button onclick="changeCount(1)">＋1</button>
            <button class="btn-red" onclick="resetAll()">クリア</button>
        </div>
    </div>
</div>

<div class="panel">
    <textarea id="log-area" readonly></textarea>
</div>

<div class="panel">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
        <div style="font-weight: bold;">
            <button id="btn-start" onclick="startMic()">開始</button>
            <button id="btn-stop" class="btn-gray" onclick="stopMic()" disabled>停止</button>
        </div>
        <div style="font-size: 13px;">
            待機:<input type="number" id="set-cooldown" class="setting-input" value="5.0" step="0.5">秒
        </div>
    </div>

    <div class="band-row">
        <div style="font-size: 12px;">LOW<br>700-820</div>
        <div class="meter-container"><div class="meter-fill" id="bar-low"></div><div class="meter-peak-line" id="peak-low" style="display:none;"></div><div class="peak-val" id="peak-val-low"></div></div>
        <input type="number" id="th-low" class="setting-input" value="0.60" step="0.01">
    </div>
    <div class="band-row">
        <div style="font-size: 12px;">MID<br>1500-1600</div>
        <div class="meter-container"><div class="meter-fill" id="bar-mid"></div><div class="meter-peak-line" id="peak-mid" style="display:none;"></div><div class="peak-val" id="peak-val-mid"></div></div>
        <input type="number" id="th-mid" class="setting-input" value="0.40" step="0.01">
    </div>
    <div class="band-row">
        <div style="font-size: 12px;">HIGH<br>3600-3920</div>
        <div class="meter-container"><div class="meter-fill" id="bar-high"></div><div class="meter-peak-line" id="peak-high" style="display:none;"></div><div class="peak-val" id="peak-val-high"></div></div>
        <input type="number" id="th-high" class="setting-input" value="0.30" step="0.01">
    </div>
</div>

<script>
    let count = 0, isRunning = false, peakLevels = {low:0, mid:0, high:0};
    
    document.addEventListener('DOMContentLoaded', () => {
        count = parseInt(localStorage.getItem('count') || 0);
        document.getElementById('count-value').innerText = count;
        document.getElementById('log-area').value = localStorage.getItem('log') || "";
    });

    function changeCount(d) {
        count = Math.max(0, count + d);
        document.getElementById('count-value').innerText = count;
        localStorage.setItem('count', count);
    }

    function resetAll() {
        if(confirm("クリアしますか？")) {
            count = 0;
            document.getElementById('count-value').innerText = "0";
            document.getElementById('log-area').value = "";
            localStorage.clear();
        }
    }

    async function startMic() {
        const stream = await navigator.mediaDevices.getUserMedia({audio:true});
        window.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const src = audioCtx.createMediaStreamSource(stream);
        window.analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        src.connect(analyser);
        isRunning = true;
        document.getElementById('btn-start').disabled = true;
        document.getElementById('btn-stop').disabled = false;
        loop();
    }

    function stopMic() {
        isRunning = false;
        audioCtx.close();
        document.getElementById('btn-start').disabled = false;
        document.getElementById('btn-stop').disabled = true;
    }

    function loop() {
        if(!isRunning) return;
        const data = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(data);
        
        ['low', 'mid', 'high'].forEach((b, i) => {
            const val = data[i+5] / 255; // 簡易抽出
            peakLevels[b] = Math.max(peakLevels[b], val);
            
            document.getElementById(`bar-${b}`).style.width = (val * 100) + '%';
            document.getElementById(`peak-${b}`).style.left = (peakLevels[b] * 100) + '%';
            document.getElementById(`peak-${b}`).style.display = 'block';
            document.getElementById(`peak-val-${b}`).innerText = peakLevels[b].toFixed(2);
        });
        requestAnimationFrame(loop);
    }
    
    setInterval(() => document.getElementById('current-time').innerText = new Date().toLocaleTimeString(), 1000);
</script>
</body>
</html>
