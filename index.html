<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>カウンター＆ログ</title>
  <style>
    body { font-family: system-ui, sans-serif; text-align: center; margin-top: 60px; }

    /* ★ 2倍サイズ ★ */
    #clock { font-size: 10rem; margin-bottom: 60px; }
    #counterDisplay { font-size: 16rem; font-weight: bold; margin: 60px 0; }

    button {
      font-size: 6rem;
      padding: 60px 120px;
      margin: 40px;
      border-radius: 40px;
      border: none;
      cursor: pointer;
    }

    #upBtn { background: #4caf50; color: #fff; }
    #downBtn { background: #f44336; color: #fff; }

    #downloadLog, #clearLog {
      font-size: 3rem;
      padding: 20px 40px;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <div id="clock"></div>

  <div id="counterDisplay">0</div>

  <div>
    <button id="upBtn">＋１</button>
    <button id="downBtn">－１</button>
  </div>

  <div>
    <button id="downloadLog">ログを保存</button>
    <button id="clearLog">オールクリア</button>
  </div>

  <script>
    // ===== 現在時刻表示 =====
    function updateClock() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hh}:${mm}:${ss}`;
    }
    setInterval(updateClock, 500);
    updateClock();

    // ===== localStorage キー =====
    const COUNT_KEY = "shared_counter_v1";
    const LOG_KEY = "shared_counter_log_v1";

    // ===== カウンター値 =====
    let count = 0;

    // ===== ログ =====
    let logs = [];

    // ===== 復元 =====
    function loadState() {
      const c = localStorage.getItem(COUNT_KEY);
      if (c !== null) count = Number(c);

      const l = localStorage.getItem(LOG_KEY);
      if (l) logs = JSON.parse(l);

      render();
    }

    function saveState() {
      localStorage.setItem(COUNT_KEY, count);
      localStorage.setItem(LOG_KEY, JSON.stringify(logs));
    }

    function render() {
      document.getElementById("counterDisplay").textContent = count;
    }

    loadState();

    // ===== 音 =====
    function playBeep() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = "sine";
      osc.frequency.value = 880;
      gain.gain.value = 0.25;

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start();
      osc.stop(ctx.currentTime + 0.15);
    }

    // ===== バイブ =====
    function vibrate() {
      if (navigator.vibrate) navigator.vibrate(150);
    }

    // ===== ログ追加 =====
    function addLog(type) {
      const now = new Date();
      const yyyy = now.getFullYear();
      const MM = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');

      logs.push(`${yyyy}-${MM}-${dd} ${hh}:${mm}:${ss}, ${type}, count=${count}`);
      saveState();
    }

    // ===== UP ボタン =====
    document.getElementById("upBtn").addEventListener("click", () => {
      count += 1;
      render();
      addLog("UP");
      playBeep();
      vibrate();
    });

    // ===== DOWN ボタン（確認ダイアログ付き） =====
    document.getElementById("downBtn").addEventListener("click", () => {

      // ★ ここが今回の追加部分 ★
      if (!confirm("カウントを減らします。よろしいですか？")) {
        return; // キャンセルしたら何もしない
      }

      count -= 1;
      render();
      addLog("DOWN");
      playBeep();
      vibrate();
    });

    // ===== ログ保存 =====
    document.getElementById("downloadLog").addEventListener("click", () => {
      const blob = new Blob([logs.join("\n")], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;

      const now = new Date();
      const fname = `counter_log_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.txt`;

      a.download = fname;
      a.click();
      URL.revokeObjectURL(url);
    });

    // ===== ログクリア（確認付き） =====
    document.getElementById("clearLog").addEventListener("click", () => {
      if (confirm("本当にログを削除しますか？\nこの操作は元に戻せません。")) {
        logs = [];
        saveState();
        alert("ログを削除しました。");
        count = 0;
        render();
      playBeep();
      vibrate();
      }
    });

    window.addEventListener("beforeunload", saveState);
  </script>

</body>
</html>
