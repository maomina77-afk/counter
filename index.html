<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>釣り鐘カウンター（フル調整版・3帯域同時判定）</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 6px;
    background: #f7f7f7;
  }
  h1 {
    font-size: 18px;
    margin: 4px 0;
    text-align: center;
  }
  #time {
    font-size: 16px;
    text-align: center;
    margin-bottom: 6px;
  }
  .panel {
    background: #fff;
    border-radius: 6px;
    padding: 6px;
    margin-bottom: 6px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
  }
  .label {
    font-weight: bold;
    font-size: 13px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin: 2px 0;
  }
  button {
    width: 100%;
    padding: 8px;
    margin: 3px 0;
    font-size: 14px;
    border-radius: 6px;
    border: none;
    background: #1976d2;
    color: #fff;
  }
  button.secondary {
    background: #555;
  }
  button.danger {
    background: #c62828;
  }
  button.small {
    width: 49%;
    font-size: 13px;
    padding: 6px;
  }
  .counter {
    font-size: 32px;
    font-weight: bold;
    text-align: center;
    margin: 4px 0;
  }
  #log {
    width: 100%;
    height: 140px;
    font-size: 11px;
    box-sizing: border-box;
  }
  .flex-row {
    display: flex;
    justify-content: space-between;
    gap: 2%;
  }
</style>
</head>
<body>
<h1>釣り鐘カウンター（フル調整・3帯域同時判定）</h1>
<div id="time"></div>

<div class="panel">
  <div class="row">
    <span class="label">マイク状態</span>
    <span id="micStatus">未開始</span>
  </div>
  <button id="startBtn">マイク開始</button>
  <button id="stopBtn" class="secondary">マイク停止</button>
</div>

<div class="panel">
  <div class="label">リアルタイム解析</div>
  <div class="row">
    <span>ピーク周波数</span>
    <span><span id="peakFreq">-</span> Hz</span>
  </div>
  <div class="row">
    <span>全体音量</span>
    <span><span id="volume">-</span></span>
  </div>
  <hr>
  <div class="row">
    <span>LOW（基音帯）</span>
    <span>700〜820 Hz</span>
  </div>
  <div class="row">
    <span>レベル</span>
    <span id="bandLowLevel">-</span>
  </div>
  <div class="row">
    <span>MID（1547Hz帯）</span>
    <span>1500〜1600 Hz</span>
  </div>
  <div class="row">
    <span>レベル</span>
    <span id="bandMidLevel">-</span>
  </div>
  <div class="row">
    <span>HIGH（3773Hz帯）</span>
    <span>3600〜3920 Hz</span>
  </div>
  <div class="row">
    <span>レベル</span>
    <span id="bandHighLevel">-</span>
  </div>
  <hr>
  <div class="row">
    <span>threshold</span>
    <span>0.2（3帯域すべて超えたら判定）</span>
  </div>
  <div class="row">
    <span>クールダウン</span>
    <span>5.0 秒</span>
  </div>
  <div class="row">
    <span>マイクゲイン</span>
    <span>1.0 倍</span>
  </div>
  <div class="row">
    <span>ローカット</span>
    <span>Highpass 300 Hz</span>
  </div>
  <div class="row">
    <span>ハイカット</span>
    <span>Lowpass 6000 Hz</span>
  </div>
  <div class="row">
    <span>サンプリングレート</span>
    <span>48000 Hz 固定</span>
  </div>
</div>

<div class="panel">
  <div class="label">カウンター</div>
  <div class="counter" id="count">0</div>
  <div class="flex-row">
    <button id="manualPlus" class="small">＋1（手動）</button>
    <button id="manualMinus" class="small secondary">−1（手動）</button>
  </div>
  <button id="clearAll" class="danger">オールクリア（カウンター＋ログ）</button>
</div>

<div class="panel">
  <div class="label">カウントログ</div>
  <textarea id="log" readonly></textarea>
  <button id="saveLog" class="secondary">ログをファイル保存</button>
</div>

<script>
/*** 周波数帯設定 ***/
const LOW_MIN  = 700;   // 基音帯（727〜797Hzをカバー）
const LOW_MAX  = 820;
const MID_MIN  = 1500;  // 1547Hz帯
const MID_MAX  = 1600;
const HIGH_MIN = 3600;  // 3773Hz帯
const HIGH_MAX = 3920;

/*** 判定・クールダウン ***/
const THRESHOLD   = 0.2;
const COOLDOWN_MS = 5000;

/*** マイク調整パラメータ ***/
const GAIN_VALUE = 1.0;     // マイクゲイン 1倍
const HP_FREQ    = 300;     // ローカット 300Hz
const LP_FREQ    = 6000;    // ハイカット 6000Hz
const SAMPLE_RATE = 48000;  // サンプリングレート固定

/*** 状態管理 ***/
let audioContext = null;
let analyser = null;
let dataArray = null;
let micStream = null;
let lastCountTime = 0;
let count = 0;
let logEntries = [];
let analyzing = false;

/*** DOM ***/
const timeEl = document.getElementById('time');
const micStatusEl = document.getElementById('micStatus');
const peakFreqEl = document.getElementById('peakFreq');
const volumeEl = document.getElementById('volume');
const bandLowLevelEl  = document.getElementById('bandLowLevel');
const bandMidLevelEl  = document.getElementById('bandMidLevel');
const bandHighLevelEl = document.getElementById('bandHighLevel');
const countEl = document.getElementById('count');
const logEl = document.getElementById('log');

const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const manualPlusBtn = document.getElementById('manualPlus');
const manualMinusBtn = document.getElementById('manualMinus');
const clearAllBtn = document.getElementById('clearAll');
const saveLogBtn = document.getElementById('saveLog');

/*** 時計 ***/
function updateClock() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  const ss = String(now.getSeconds()).padStart(2, '0');
  timeEl.textContent = `現在時刻：${hh}:${mm}:${ss}`;
}
setInterval(updateClock, 500);
updateClock();

/*** ローカルストレージ ***/
const STORAGE_KEY_COUNT = 'bellCounter_full_count';
const STORAGE_KEY_LOG   = 'bellCounter_full_log';
const STORAGE_KEY_MIC   = 'bellCounter_full_micAutoStart';

function loadState() {
  const savedCount = localStorage.getItem(STORAGE_KEY_COUNT);
  if (savedCount !== null) {
    count = parseInt(savedCount, 10) || 0;
  }
  const savedLog = localStorage.getItem(STORAGE_KEY_LOG);
  if (savedLog) {
    try {
      logEntries = JSON.parse(savedLog);
    } catch {
      logEntries = [];
    }
  }
  renderState();
}

function saveState() {
  localStorage.setItem(STORAGE_KEY_COUNT, String(count));
  localStorage.setItem(STORAGE_KEY_LOG, JSON.stringify(logEntries));
}

function setMicAutoStart(flag) {
  localStorage.setItem(STORAGE_KEY_MIC, flag ? '1' : '0');
}

function getMicAutoStart() {
  return localStorage.getItem(STORAGE_KEY_MIC) === '1';
}

function renderState() {
  countEl.textContent = count;
  logEl.value = logEntries.join('\n');
}

/*** ログ ***/
function addLogEntry(type, delta, reason) {
  const now = new Date();
  const dateStr = now.toLocaleString('ja-JP');
  const entry = `[${dateStr}] ${type} ${delta > 0 ? '+' : ''}${delta}（合計: ${count}）${reason ? ' - ' + reason : ''}`;
  logEntries.push(entry);
  renderState();
  saveState();
}

/*** ビープ音（Web Audioで短いビープ） ***/
function playBeep() {
  try {
    if (!audioContext) return;
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.2, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.15);
    osc.connect(gain);
    gain.connect(audioContext.destination);
    osc.start();
    osc.stop(audioContext.currentTime + 0.15);
  } catch (e) {
    console.warn('ビープ失敗:', e);
  }
}

/*** 自動カウント ***/
function autoCount() {
  const now = Date.now();
  if (now - lastCountTime < COOLDOWN_MS) return;
  count++;
  lastCountTime = now;
  playBeep();
  addLogEntry('自動検出', +1, '3帯域同時検出');
}

/*** 手動カウント ***/
manualPlusBtn.addEventListener('click', () => {
  if (!confirm('カウンターを +1 しますか？')) return;
  count++;
  playBeep();
  addLogEntry('手動操作', +1, 'ユーザー操作');
});

manualMinusBtn.addEventListener('click', () => {
  if (!confirm('カウンターを -1 しますか？')) return;
  if (count > 0) count--;
  playBeep();
  addLogEntry('手動操作', -1, 'ユーザー操作');
});

/*** オールクリア ***/
clearAllBtn.addEventListener('click', () => {
  if (!confirm('カウンターとログをすべてクリアしますか？')) return;
  count = 0;
  logEntries = [];
  playBeep();
  renderState();
  saveState();
});

/*** ログをファイル保存 ***/
saveLogBtn.addEventListener('click', () => {
  if (logEntries.length === 0) {
    alert('ログがありません。');
    return;
  }
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const d = String(now.getDate()).padStart(2, '0');
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  const ss = String(now.getSeconds()).padStart(2, '0');
  const filename = `bell_log_${y}${m}${d}_${hh}${mm}${ss}.txt`;

  const blob = new Blob([logEntries.join('\n')], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

/*** マイク開始 ***/
async function startMic() {
  if (audioContext && analyzing) return;
  try {
    if (!audioContext) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)({
        sampleRate: SAMPLE_RATE
      });
    }
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const source = audioContext.createMediaStreamSource(micStream);

    // ゲイン＋ローカット＋ハイカット
    const gainNode = audioContext.createGain();
    gainNode.gain.value = GAIN_VALUE;

    const hp = audioContext.createBiquadFilter();
    hp.type = "highpass";
    hp.frequency.value = HP_FREQ;

    const lp = audioContext.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = LP_FREQ;

    analyser = audioContext.createAnalyser();
    analyser.fftSize = 2048;
    const bufferLength = analyser.frequencyBinCount;
    dataArray = new Uint8Array(bufferLength);

    // 接続: source -> gain -> highpass -> lowpass -> analyser
    source.connect(gainNode);
    gainNode.connect(hp);
    hp.connect(lp);
    lp.connect(analyser);

    micStatusEl.textContent = '動作中';
    startBtn.disabled = true;
    stopBtn.disabled = false;
    analyzing = true;
    setMicAutoStart(true);
    analyzeLoop();
  } catch (e) {
    console.error(e);
    micStatusEl.textContent = 'エラー（マイク許可を確認）';
    analyzing = false;
    setMicAutoStart(false);
  }
}

/*** マイク停止 ***/
function stopMic() {
  try {
    if (micStream) {
      micStream.getTracks().forEach(t => t.stop());
      micStream = null;
    }
  } catch (e) {
    console.warn(e);
  }
  analyzing = false;
  micStatusEl.textContent = '停止中';
  startBtn.disabled = false;
  stopBtn.disabled = true;
  setMicAutoStart(false);
}

/*** 解析ループ ***/
function analyzeLoop() {
  if (!analyser || !audioContext || !analyzing) return;

  analyser.getByteFrequencyData(dataArray);

  // 全体ピーク
  let maxVal = 0;
  let maxIndex = 0;
  for (let i = 0; i < dataArray.length; i++) {
    if (dataArray[i] > maxVal) {
      maxVal = dataArray[i];
      maxIndex = i;
    }
  }
  const nyquist = audioContext.sampleRate / 2;
  const freqPerBin = nyquist / dataArray.length;
  const peakFreq = Math.round(maxIndex * freqPerBin);
  const volume = maxVal / 255;

  peakFreqEl.textContent = peakFreq;
  volumeEl.textContent = volume.toFixed(3);

  // 指定帯域のレベル（最大値）
  function bandLevel(minHz, maxHz) {
    let max = 0;
    for (let i = 0; i < dataArray.length; i++) {
      const f = i * freqPerBin;
      if (f >= minHz && f <= maxHz) {
        if (dataArray[i] > max) max = dataArray[i];
      }
    }
    return max / 255;
  }

  const lowLevel  = bandLevel(LOW_MIN,  LOW_MAX);
  const midLevel  = bandLevel(MID_MIN,  MID_MAX);
  const highLevel = bandLevel(HIGH_MIN, HIGH_MAX);

  bandLowLevelEl.textContent  = lowLevel.toFixed(3);
  bandMidLevelEl.textContent  = midLevel.toFixed(3);
  bandHighLevelEl.textContent = highLevel.toFixed(3);

  // 3帯域すべて threshold 以上ならカウント
  if (lowLevel >= THRESHOLD &&
      midLevel >= THRESHOLD &&
      highLevel >= THRESHOLD) {
    autoCount();
  }

  requestAnimationFrame(analyzeLoop);
}

/*** ボタンイベント ***/
startBtn.addEventListener('click', () => {
  startMic();
});

stopBtn.addEventListener('click', () => {
  stopMic();
});

/*** 初期化 ***/
loadState();
stopBtn.disabled = true;

// リロード後もマイク継続（許可済みなら自動開始を試みる）
window.addEventListener('load', () => {
  if (getMicAutoStart()) {
    startMic();
  }
});
</script>
</body>
</html>
